<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- Leucin-strukturformel (skeletal formula) -->
  <!-- CH3 top-left → branch-C -->
  <line x1="68" y1="44" x2="104" y2="72" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- CH3 bottom-left → branch-C -->
  <line x1="68" y1="100" x2="104" y2="72" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- branch-C → CH2 -->
  <line x1="104" y1="72" x2="140" y2="44" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- CH2 → alpha-C -->
  <line x1="140" y1="44" x2="176" y2="72" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- alpha-C → COOH -->
  <line x1="176" y1="72" x2="212" y2="44" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- alpha-C → NH2 (grøn = aminogruppe) -->
  <line x1="176" y1="72" x2="176" y2="106" stroke="#2d6a4f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Knudepunkter (carbon vertices) -->
  <circle cx="104" cy="72" r="3" fill="#d62828"/>
  <circle cx="140" cy="44" r="3" fill="#d62828"/>
  <circle cx="176" cy="72" r="3" fill="#d62828"/>

  <!-- Atom-labels -->
  <text x="30" y="42" font-size="12" fill="#d62828" font-weight="700">CH&#8323;</text>
  <text x="30" y="105" font-size="12" fill="#d62828" font-weight="700">CH&#8323;</text>
  <text x="216" y="42" font-size="12" fill="#d62828" font-weight="700">COOH</text>
  <text x="162" y="126" font-size="12" fill="#2d6a4f" font-weight="700">NH&#8322;</text>

  <!-- Leucin-label diskret -->
  <text x="140" y="16" font-size="9" fill="#aaa" text-anchor="middle" letter-spacing="2" font-weight="500">LEUCIN</text>

  <!-- Skillelinje -->
  <line x1="24" y1="142" x2="316" y2="142" stroke="#e2e5ea" stroke-width="1"/>

  <!-- Brandnavn -->
  <text x="170" y="168" font-size="26" fill="#111827" font-weight="800" text-anchor="middle" letter-spacing="-0.8">Billig Protein</text>

  <!-- Tagline -->
  <text x="170" y="186" font-size="9.5" fill="#6b7280" text-anchor="middle" letter-spacing="1.2" font-weight="500">BIOLOGISK KORRIGEREDE PROTEINPRISER</text>

</svg>
